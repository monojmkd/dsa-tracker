<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e3e1da;--acc:#2f5d50;--accfg:#fff;--easy:#2e7d4f;--med:#b7791f;--hard:#b83a3a;--code:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#1f211e;--ink:#ecebe6;--mute:#9a9992;--line:#32342f;--acc:#7fc4ad;--accfg:#11201b;--easy:#6fcf97;--med:#e5b45c;--hard:#ee7b7b;--code:#161715}}
:root[data-theme="dark"]{--bg:#161715;--card:#1f211e;--ink:#ecebe6;--mute:#9a9992;--line:#32342f;--acc:#7fc4ad;--accfg:#11201b;--easy:#6fcf97;--med:#e5b45c;--hard:#ee7b7b;--code:#161715}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--mute);font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.d{color:var(--hard)}
button:hover{filter:brightness(.96)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
textarea.code,pre{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mute)}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:640px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t{font-weight:600;flex:1;min-width:160px}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.Easy{color:var(--easy);border-color:var(--easy)}.Medium{color:var(--med);border-color:var(--med)}.Hard{color:var(--hard);border-color:var(--hard)}
.Solved{background:var(--acc);color:var(--accfg);border-color:var(--acc)}.Revisit{color:var(--med);border-color:var(--med)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px;z-index:9}
.modal{background:var(--bg);border-radius:14px;max-width:760px;width:100%;padding:18px;border:1px solid var(--line)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/-1}
@media(max-width:560px){.f{grid-template-columns:1fr}}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:2px}
.tabs{display:flex;gap:6px;margin:12px 0 6px}
.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:0;white-space:pre}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:16px 0 4px}
p.n{white-space:pre-wrap;margin:0}
.note{font-size:12px;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px;color:var(--mute)}
a{color:var(--acc)}
table{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}th{background:var(--card)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.nav button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.vb{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--card);margin-bottom:8px}
.vb .row input{flex:1;min-width:110px}
.f h3{grid-column:1/-1;margin:10px 0 0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
.kv{display:grid;gap:8px}.kv b{font-size:12px;color:var(--mute);display:block}
.link{cursor:pointer;text-decoration:underline}[hidden]{display:none!important}
.bar2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:640px){.bar2{grid-template-columns:1fr 1fr}.bar2 input{grid-column:1/-1}}
.rel{margin:0;padding-left:20px}.rel li{margin:3px 0}
.qtext{font-size:17px;font-weight:600;margin:10px 0}
.ans{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.bar4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:14px}.bar4 input{grid-column:1/-1}
.rc-Red{color:var(--hard);border-color:var(--hard)}.rc-Yellow{color:var(--med);border-color:var(--med)}.rc-Green{color:var(--easy);border-color:var(--easy)}
.due{color:var(--hard);border-color:var(--hard);font-weight:600}
input[type=checkbox]{width:auto;padding:0}
.cbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:8px}.cbar #cq{grid-column:1/-1}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}.opts label{display:flex;gap:6px;align-items:center;font-size:13px;margin:0;cursor:pointer}
pre.cx{padding:8px 0}.cl{display:flex;white-space:pre}.cl .no{flex:none;width:40px;text-align:right;padding-right:10px;color:var(--mute);user-select:none}.cl.hit{background:rgba(255,196,0,.25)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>DSA Tracker</h1><div class="sub">Java, JavaScript &amp; TypeScript solutions, notes, interview questions and revision list</div></div>
    <div class="row"><button id="lock" title="Forget password on this device">Lock</button><button id="imp">Import</button><input type="file" id="impf" accept="application/json" hidden><button id="exp">Export</button><button class="p" id="add">+ Add problem</button></div>
  </header>
  <div id="mode"></div>
  <div class="nav"><button id="tProb">Problems</button><button id="tPat">Patterns</button><button id="tInt">Interview</button><button id="tRel">Related</button><button id="tRev">Revise</button><button id="tCodeSearch">Code</button></div>
  <div id="pv">
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" placeholder="Search title, tag, notes, code…">
    <select id="fTopic"></select>
    <select id="fDiff"><option value="">All levels</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
    <select id="fStat"><option value="">All status</option><option>Todo</option><option>Attempted</option><option>Solved</option><option>Revisit</option></select>
    <select id="fLang"><option value="">Any language</option><option value="java">Has Java</option><option value="js">Has JS</option><option value="ts">Has TS</option><option value="both">Java + JS</option></select>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
  </div>
  <div id="patv" hidden><div class="row" style="margin-bottom:10px"><button class="p" id="addp">+ Add pattern</button><span class="sub">Recognition cues and reusable templates for each pattern</span></div><div id="patl"></div></div>
  <div id="intv" hidden>
    <div class="row" style="margin-bottom:10px"><button class="p" id="rq">Random question</button><span class="sub" id="ic"></span></div>
    <div class="bar2"><input id="iq" placeholder="Search questions, answers, problems…"><select id="ik"><option value="">All kinds</option><option>Follow-up</option><option>Concept</option><option>Complexity</option><option>Edge case</option><option>Trade-off</option></select><select id="it"></select></div>
    <div id="il"></div>
  </div>
  <div id="relv" hidden>
    <div class="sub" id="xc" style="margin-bottom:10px"></div>
    <div class="bar4"><input id="xq" placeholder="Search related problems, reasons, source problems…">
      <select id="xs"><option value="todo" selected>Not solved yet</option><option value="">All</option><option value="solved">Already solved</option></select>
      <select id="xsrc"></select><select id="xt"></select>
      <select id="xo"><option value="refs">Most referenced first</option><option value="num">By problem number</option></select></div>
    <div id="xl"></div>
  </div>
  <div id="revv" hidden>
    <div class="sub" id="rvc" style="margin-bottom:10px"></div>
    <div class="bar4"><input id="rvq" placeholder="Search problems to revise…">
      <select id="rvs"><option value="due" selected>Due now</option><option value="soon">Next 7 days</option><option value="later">Later</option><option value="none">Not scheduled</option><option value="">All</option></select>
      <select id="rvr"><option value="">Any recall level</option><option>Red</option><option>Yellow</option><option>Green</option><option value="none">Not rated</option></select>
      <select id="rvm"><option value="">Any mistake type</option><option>Concept</option><option>Logic</option><option>Syntax</option><option>Edge Case</option></select></div>
    <div id="rvl"></div>
  </div>
  <div id="codev" hidden>
    <div class="sub" id="cc" style="margin-bottom:10px"></div>
    <div class="cbar"><input id="cq" placeholder="Paste or type code, e.g. fast.next.next or while (left < right)">
      <select id="cl"><option value="">All languages</option><option value="java">Java</option><option value="js">JavaScript</option><option value="ts">TypeScript</option></select>
      <select id="cw"><option value="">Solutions, alternates and templates</option><option value="sol">Solutions only</option><option value="alt">Alternate approaches only</option><option value="pat">Pattern templates only</option></select></div>
    <div class="opts"><label><input type="checkbox" id="cs"> Match case</label><label><input type="checkbox" id="cr"> Regular expression</label></div>
    <div id="cres"></div>
  </div>
</div>
<div id="ovr"></div>
<script>
const TOPICS=["Arrays","Strings","Hash Map","Two Pointers","Sliding Window","Stack / Queue","Linked List","Trees","Graphs","Heap","Binary Search","Recursion / Backtracking","Dynamic Programming","Greedy","Sorting","Bit Manipulation","Math","Trie"];
const $=s=>document.querySelector(s);
function h(t,a={},...c){const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}c.flat().forEach(x=>{if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x))});return e}
let items=[],ready=false;
const PW='dsa-tracker-pw';
function banner(msg){const m=$('#mode');m.replaceChildren(msg?h('div',{class:'note'},msg):'')}
async function api(method,body,qs=''){
  for(;;){
    let pw=localStorage.getItem(PW);
    if(!pw){pw=prompt('Enter your tracker password');if(pw==null)throw new Error('cancelled');localStorage.setItem(PW,pw)}
    const r=await fetch('/api/problems'+qs,{method,headers:{'Content-Type':'application/json','x-password':pw},body:body?JSON.stringify(body):undefined});
    if(r.status===401){localStorage.removeItem(PW);alert('Wrong password, try again.');continue}
    if(!r.ok)throw new Error('Request failed ('+r.status+')');
    return r.json();
  }
}
async function init(){
  try{items=await api('GET');banner('')}
  catch(e){items=[];banner('Could not load from the server: '+e.message+'. Refresh to retry.')}
  ready=true;render();
}
async function save(it){
  it.updated=Date.now();
  try{await api('PUT',it);const i=items.findIndex(x=>x.id===it.id);i>=0?items[i]=it:items.unshift(it);banner('')}
  catch(e){banner('Save failed: '+e.message)}
  render();
}
async function del(id){
  try{await api('DELETE',null,'?id='+encodeURIComponent(id));items=items.filter(x=>x.id!==id);banner('')}
  catch(e){banner('Delete failed: '+e.message)}
  render();
}

let tab='problems';
const PATS=["Two Pointers","Sliding Window","Fast & Slow Pointers","Prefix Sum","Hashing","Binary Search","Monotonic Stack","BFS","DFS","Backtracking","DP (1D)","DP (2D)","Greedy","Heap / Top-K","Union Find","Topological Sort","Intervals","Trie","Bit Manipulation"];
const CUES={"Two Pointers":"Sorted array or string; find a pair or triplet; compare both ends; in-place removal or partition.","Sliding Window":"Contiguous subarray or substring; longest, shortest or count under a constraint; the window grows and shrinks.","Prefix Sum":"Many range-sum queries; subarray sum equals K; cumulative counts.","Hashing":"Need fast lookup, counts, duplicates or a complement (target - x).","Binary Search":"Sorted data, or a monotonic yes/no answer you can search on (smallest or largest feasible value).","Monotonic Stack":"Next greater or smaller element; spans; largest rectangle.","BFS":"Shortest path in an unweighted graph or grid; level by level; minimum steps.","DFS":"Explore all paths, connected components, tree recursion, cycle detection.","Backtracking":"Generate all combinations, permutations or subsets: choose, explore, undo.","DP (1D)":"Overlapping subproblems; count ways or min/max; state depends on the previous few values.","DP (2D)":"Two sequences or a grid; state is (i, j); LCS, edit distance, grid paths.","Greedy":"A local best choice is provably safe; intervals and scheduling; try sorting first.","Heap / Top-K":"K largest or smallest, streaming median, repeatedly need the current min or max."};
const P=()=>items.filter(i=>i.kind!=='pattern'),PR=()=>items.filter(i=>i.kind==='pattern');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const patNames=()=>{const c={};P().forEach(i=>{if(i.pattern)c[i.pattern]=(c[i.pattern]||0)+1});
  return [...new Set([...PATS,...PR().map(p=>p.title),...Object.keys(c)])].sort((a,b)=>(c[b]||0)-(c[a]||0)||a.localeCompare(b))};
const tabKey=ev=>{if(ev.key==='Tab'){ev.preventDefault();const t=ev.target;t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end')}};
const sec=(l,c)=>c?h('div',{},h('h3',{},l),c):null;

function rich(t){
  const out=h('div');let tb=[],tx=[];
  const fl=()=>{if(!tb.length)return;
    const rows=tb.filter(r=>!/^[\s|:-]+$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    const [hd,...bd]=rows;
    out.append(h('div',{style:'overflow-x:auto'},h('table',{},h('thead',{},h('tr',{},...hd.map(c=>h('th',{},c)))),h('tbody',{},...bd.map(r=>h('tr',{},...r.map(c=>h('td',{},c))))))));tb=[]};
  const ft=()=>{if(tx.length){out.append(h('p',{class:'n'},tx.join('\n')));tx=[]}};
  for(const l of (t||'').split('\n')){if(l.trim().startsWith('|')){ft();tb.push(l)}else{fl();tx.push(l)}}
  fl();ft();return out}

function codeTabs(o){
  const langs=[['java','Java'],['js','JavaScript'],['ts','TypeScript']].filter(([k])=>o[k]);
  const box=h('div'),tabs=h('div',{class:'tabs'});let cur=langs[0]?.[0];
  const show=()=>{
    tabs.replaceChildren(...langs.map(([k,n])=>h('button',{class:k===cur?'on':'',onclick:()=>{cur=k;show()}},n)),
      langs.length?h('button',{onclick:e=>{navigator.clipboard?.writeText(o[cur]);const b=e.target;b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}},'Copy'):null);
    box.replaceChildren(cur?h('pre',{},o[cur]):h('div',{class:'sub'},'No code saved yet.'))};
  show();return h('div',{},tabs,box)}

const KINDS=['Follow-up','Concept','Complexity','Edge case','Trade-off'];
const intAll=()=>P().flatMap(p=>(p.interview||[]).map(x=>({p,q:x.q,a:x.a,kind:x.kind||'Follow-up'})));
function intMatch(x){
  const q=$('#iq').value.toLowerCase(),k=$('#ik').value,t=$('#it').value;
  if(k&&x.kind!==k)return false;if(t&&x.p.topic!==t)return false;
  return !q||[x.q,x.a,x.p.title,x.p.pattern].join(' ').toLowerCase().includes(q)}
function renderInt(){
  const all=intAll(),tp=$('#it'),cur=tp.value;
  const topics=[...new Set(all.map(x=>x.p.topic).filter(Boolean))].sort();
  tp.replaceChildren(h('option',{value:''},'All topics'),...topics.map(t=>h('option',{value:t},t)));
  tp.value=topics.includes(cur)?cur:'';
  const res=all.filter(intMatch);
  $('#ic').textContent=res.length+' of '+all.length+' questions';
  $('#il').replaceChildren(...(res.length?res.map(x=>h('details',{},h('summary',{},x.q),
    h('div',{class:'row',style:'margin:6px 0'},h('span',{class:'badge'},x.kind),h('span',{class:'badge link',onclick:()=>view(x.p.id)},x.p.title)),
    h('p',{class:'n'},x.a))):[h('div',{class:'empty'},all.length?'No questions match these filters.':'No interview questions yet. Add them on a problem, or import a file that has them.')]));
}
function practice(){
  const pool=intAll().filter(intMatch);
  if(!pool.length){alert('No questions match the current filters.');return}
  let cur;const body=h('div');
  const show=rev=>body.replaceChildren(
    h('div',{class:'row'},h('span',{class:'badge'},cur.kind),h('span',{class:'sub'},cur.p.title)),
    h('p',{class:'qtext'},cur.q),
    rev?h('div',{class:'ans'},h('p',{class:'n'},cur.a)):h('button',{class:'p',onclick:()=>show(true)},'Show answer'),
    h('div',{class:'row',style:'margin-top:14px'},h('button',{onclick:next},'Next question'),h('button',{onclick:()=>view(cur.p.id)},'Open problem')));
  const next=()=>{cur=pool[Math.floor(Math.random()*pool.length)];show(false)};
  modal(h('div',{class:'row'},h('h1',{style:'flex:1'},'Practice'),h('button',{onclick:close},'Close')),body);next();
}

/* ---- dry-run diagram: each step becomes a card, arrows join the steps, changed values are highlighted ---- */
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function wrapTxt(s,max){
  const out=[];let line='';
  for(let w of String(s).split(/\s+/).filter(Boolean)){
    while(w.length>max){if(line){out.push(line);line=''}out.push(w.slice(0,max));w=w.slice(max)}
    if(!line)line=w;else if((line+' '+w).length<=max)line+=' '+w;else{out.push(line);line=w}
  }
  if(line)out.push(line);return out.length?out:[''];
}
function parseTrace(t){
  const blocks=[];let tb=[],tx=[];
  const flush=()=>{if(!tb.length)return;
    const rows=tb.filter(r=>!/^[\s|:-]+$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
    if(rows.length>=2)blocks.push({heading:tx.join(' ').trim(),head:rows[0],rows:rows.slice(1)});
    tx=[];tb=[]};
  for(const l of String(t||'').split('\n')){
    if(l.trim().startsWith('|'))tb.push(l);
    else{if(tb.length)flush();if(l.trim())tx.push(l.trim())}
  }
  flush();
  return {blocks,notes:tx};
}
function traceSvg(title,subtitle,text){
  const {blocks,notes}=parseTrace(text);if(!blocks.length)return null;
  const CW=240,GX=40,GY=36,PAD=24,PER=3,LH=15,HEAD=26,VW=7.3,LW=6.2,INNER=CW-24,W=PAD*2+PER*CW+(PER-1)*GX;
  const MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace';
  let y=PAD,b='';
  const T=(x,yy,s,cls)=>'<text x="'+x+'" y="'+yy+'" class="'+cls+'">'+xe(s)+'</text>';
  b+=T(PAD,y+18,title,'ti');y+=30;
  if(subtitle){const sl=wrapTxt('Input: '+String(subtitle).replace(/^input:\s*/i,''),100);sl.forEach((l,k)=>b+=T(PAD,y+14+k*16,l,'su'));y+=sl.length*16+8}
  y+=6;
  for(const blk of blocks){
    if(blk.heading){const hl=wrapTxt(blk.heading,100);hl.forEach((l,k)=>b+=T(PAD,y+14+k*17,l,'hd'));y+=hl.length*17+10}
    const nc=blk.head.length,isText=[];
    for(let c=1;c<nc;c++){const vals=blk.rows.map(r=>r[c]||'');isText[c]=vals.reduce((a,v)=>a+v.length,0)/vals.length>24||vals.filter(v=>v.split(/\s+/).length>=5).length>vals.length/2}
    const cards=blk.rows.map((r,ri)=>{
      const prev=ri?blk.rows[ri-1]:null,t0=r[0]||'',h0=blk.head[0]||'';
      const ttl=!t0?h0:/^start$/i.test(t0)?'start':(/^[\w.\-]{1,10}$/.test(t0)?h0+' = '+t0:t0);
      const items=[];let n=0;
      for(let c=1;c<nc;c++){
        const lab=blk.head[c]||'',val=r[c]||'';if(val==='')continue;
        const changed=!!prev&&!isText[c]&&(prev[c]||'')!==val;
        let lines;
        if(isText[c])lines=[{lab,val:''},...wrapTxt(val,38).map(v=>({val:v,tx:1}))];
        else if(lab.length*LW+10+val.length*VW<=INNER)lines=[{lab,val}];
        else lines=[{lab,val:''},...wrapTxt(val,Math.floor(INNER/VW)).map(v=>({val:v}))];
        items.push({lines,changed});n+=lines.length}
      return {ttl,items,h:HEAD+14+n*LH+6};
    });
    const pos=[];
    for(let s=0;s<cards.length;s+=PER){
      const row=cards.slice(s,s+PER),rh=Math.max(...row.map(c=>c.h));
      row.forEach((c,k)=>pos.push({c,x:PAD+k*(CW+GX),y,h:rh}));y+=rh+GY;
    }

// returns [{s,e}] = first and last line (0-based) of each match
function codeFind(code,q,opt){

    let m;while((m=re.exec(code))&&out.length<50){out.push({s:lineOf(m.index),e:lineOf(m.index+Math.max(m[0].length-1,0))});if(m[0].length===0)re.lastIndex++}
    return out;
  }

  let comp='';const lineIdx=[];
  lines.forEach((l,li)=>{for(const ch of l){if(/\s/.test(ch))continue;const t=norm(ch);for(let k=0;k<t.length;k++){comp+=t[k];lineIdx.push(li)}}});

function renderCode(){
